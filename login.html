<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css" />
    <title>Вход — nouer</title>
  </head>
  <body data-page="login">
    <header id="hd" class="top"></header>
    <main>
      <section class="narrow">
        <h1>Вход</h1>
        <form id="f" novalidate>
          <label
            >Электронная почта<input
              name="email"
              type="email"
              required
              autocomplete="email"
          /></label>
          <label
            >Пароль<input
              name="pass"
              type="password"
              required
              autocomplete="current-password"
          /></label>
          <p class="err" role="alert"></p>
          <button class="btn solid">Войти</button>
        </form>
        <p class="note">
          Учебная версия: войти можно только в аккаунт, созданный в этом
          браузере.
        </p>
        <p class="alt">
          Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </p>
      </section>
    </main>
    <footer>
      nouer — nouer les liens, ensemble.
      <div class="counter">
        <!--LiveInternet counter--><a
          href="https://www.liveinternet.ru/click"
          target="_blank"
          ><img
            id="licntFFEA"
            width="88"
            height="31"
            style="border: 0"
            title="LiveInternet: показано число просмотров за 24 часа, посетителей за 24 часа и за сегодня"
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAEALAAAAAABAAEAAAIBTAA7"
            alt=""
        /></a>
        <script>
          (function (d, s) {
            d.getElementById("licntFFEA").src =
              "https://counter.yadro.ru/hit?t17.6;r" +
              escape(d.referrer) +
              (typeof s == "undefined"
                ? ""
                : ";s" +
                  s.width +
                  "*" +
                  s.height +
                  "*" +
                  (s.colorDepth ? s.colorDepth : s.pixelDepth)) +
              ";u" +
              escape(d.URL) +
              ";h" +
              escape(d.title.substring(0, 150)) +
              ";" +
              Math.random();
          })(document, screen);
        </script>
        <!--/LiveInternet-->
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
