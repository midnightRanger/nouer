<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap"

    <title>Регистрация — nouer</title>

<body data-page="reg">
    <header id="hd" class="top"></header>
    <main>
        <section class="narrow">
            <h1>Регистрация</h1>
            <form id="f" novalidate>
                <label>Имя<input name="name" required autocomplete="name" /></label>
                <label>Электронная почта<input name="email" type="email" required autocomplete="email" /></label>
                <label>Пароль, не короче 6 символов<input name="pass" type="password" required minlength="6"
                        autocomplete="new-password" /></label>
                <label>Повторите пароль<input name="pass2" type="password" required
                        autocomplete="new-password" /></label>
                <p class="err" role="alert"></p>
                <button class="btn solid">Создать аккаунт</button>
            </form>
            <p class="note">
                Учебная версия: данные аккаунта сохраняются только в вашем браузере.
            </p>
            <p class="alt">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </section>
    </main>
    <footer>
        nouer &mdash; nouer les liens, ensemble.
